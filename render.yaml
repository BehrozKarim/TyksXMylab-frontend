services:
  - type: web
    name: tyks-ward-evidence
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_DATA_MODE
        value: api
      # Full public backend URL INCLUDING /api/v1, with no trailing slash.
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_DEMO_CONTROLS
        value: "1"
      - key: VITE_HOSTED_DEMO
        value: "1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
